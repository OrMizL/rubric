name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: @rubric/core is consumed via its built dist/index.d.ts,
      # so typecheck of the dependent packages needs it to exist.
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test

      # packages/action/dist/index.cjs is committed and run by GitHub Actions with
      # no install step, so a change to packages/core that skips the rebuild ships
      # stale code while every other job here stays green. `pnpm -r build` above
      # already regenerated it; any drift means the commit is missing the rebuild.
      - name: Verify the committed Action bundle is up to date
        run: |
          git diff --exit-code -- packages/action/dist/index.cjs || {
            echo "::error::packages/action/dist/index.cjs is stale."
            echo "Run: pnpm --filter @rubric/action build && git add -f packages/action/dist/index.cjs"
            exit 1
          }
